version: "1"

services:
  - type: web
    name: ledgerline-app
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerline-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_LOGIN_MAX
        value: 5
      - key: RATE_LIMIT_API_MAX
        value: 100

databases:
  - name: ledgerline-db
    databaseName: ledgerline
    user: ledger
    plan: free
    postgresMajorVersion: 16
